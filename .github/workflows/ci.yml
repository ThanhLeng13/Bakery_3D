name: CI

# Runs on every push and pull request so GitHub reports pass/fail directly on
# the branch and PR, instead of relying on a local test run.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Read-only by default. This workflow only checks out and builds code, so it
# never needs a write token; granting one would let a compromised dependency
# step push to the repository.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned to the interpreter the suite is actually developed against.
          # The project venv runs 3.13; building on an older minor caused
          # failures that could not be reproduced locally.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Pinned: pytest 9 + pytest-asyncio 1.3 is the combination verified
          # locally. Unpinned installs resolved to a mismatched pair in CI.
          pip install "pytest==9.0.3" "pytest-asyncio==1.3.0"

      - name: Run tests
        # Tests use mocked Supabase clients, so no secrets are required here.
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-key
          JWT_SECRET: test-jwt-secret-for-ci
          GROQ_API_KEY: test-groq-key
        run: python -m pytest -q --no-header

  frontend:
    name: Frontend typecheck and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint --max-warnings=0

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
        run: npx next build

  geometry:
    name: Cake geometry (GLB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Decoration surfaces must follow the real frosting of all six bodies,
      # otherwise toppings float, sink into the cake, or hang outside a
      # non-round outline. Runs on the committed .glb files, so a regression
      # shows up on the PR instead of at the defence.
      - name: Decoration surfaces fit the cake bodies
        run: node scripts/test-cake-decorations.cjs

      # Asset budget and pivot placement for the decoration models. A model
      # whose pivot sits above ground sinks into the cake when placed.
      - name: Decoration models are valid
        run: node scripts/validate-decoration-models.js

      # A failed or slow asset fetch must not leave a blank canvas: the studio
      # falls back to a procedurally drawn cake, the product page to a message.
      - name: GLB failure leaves no blank canvas
        run: node scripts/test-glb-fallback.cjs
