name: CI

# Runs on every push and pull request so GitHub reports pass/fail directly on
# the branch and PR, instead of relying on a local test run.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        # Tests use mocked Supabase clients, so no secrets are required here.
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-key
          JWT_SECRET: test-jwt-secret-for-ci
          GROQ_API_KEY: test-groq-key
        run: pytest -q --no-header

  frontend:
    name: Frontend typecheck and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint --max-warnings=0

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
        run: npx next build
