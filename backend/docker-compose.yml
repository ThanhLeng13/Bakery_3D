version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cake-shop-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      # `httpx.get(...)` không ném lỗi khi server trả 500, nên container lỗi vẫn
      # được báo "healthy". Phải kiểm mã trạng thái HTTP.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import httpx,sys; r=httpx.get('http://localhost:8000/health', timeout=5); sys.exit(0 if r.status_code == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Production service (use: docker-compose --profile production up api-prod)
  api-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cake-shop-api-prod
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - DEBUG=false
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    restart: unless-stopped
    healthcheck:
      # Cùng lý do với service `api`: phải kiểm mã trạng thái, không chỉ gọi được.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import httpx,sys; r=httpx.get('http://localhost:8000/health', timeout=5); sys.exit(0 if r.status_code == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - production
